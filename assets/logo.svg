<?xml version="1.0" encoding="UTF-8"?>
<!--
  urduofdani :: vector logo
  A rounded "gzip tile" carrying an Urdu "alef" (ا) rendered as a gradient bar,
  with the teal dot standing for the single-space token boundary.
  Hand-authored, no fonts required, scales to any size (favicon -> billboard).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="urduofdani logo">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#14b8a6"/>
      <stop offset="55%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#0b1220"/>
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none"
        stroke="url(#ring)" stroke-width="12"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#glow)"/>

  <!-- alef with a soft glow -->
  <rect x="228" y="102" width="56" height="228" rx="28" fill="#38bdf8"
        opacity="0.45" filter="url(#soft)"/>
  <rect x="228" y="102" width="56" height="228" rx="28" fill="url(#bar)"/>

  <!-- token dot -->
  <circle cx="186" cy="394" r="26" fill="#2dd4bf"/>
  <circle cx="186" cy="394" r="12" fill="#ffffff"/>
</svg>
